# Crea l'app per Mac con chip Apple (.dmg e .zip) e la pubblica come release su GitHub.
# Si avvia a mano da Actions → "App per Mac" → Run workflow, oppure con un tag v*.
name: App per Mac

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Senza certificato Apple: l'app non è firmata (al primo avvio: tasto destro → Apri).
      - run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: grillo-parlante-mac
          path: |
            release/*.dmg
            release/*.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('mac-build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('App per Mac (build {0})', github.run_number) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: |
            release/*.dmg
            release/*.zip
